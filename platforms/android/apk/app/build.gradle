plugins { id 'com.android.application' }
def workspace = rootProject.file('../../..')
def abi = providers.gradleProperty('gemrbAbi').getOrElse('arm64-v8a')
android {
    namespace 'org.gemrb.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.gemrb.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-milestone3'
        ndk { abiFilters abi }
    }
    sourceSets.main {
        java.srcDir new File(workspace, 'build/android/dependencies-' + abi + '/_deps/sdl2-src/android-project/app/src/main/java')
        assets.srcDir new File(workspace, 'build/android/apk-input/' + abi + '/assets')
        jniLibs.srcDir new File(workspace, 'build/android/apk-input/' + abi + '/jniLibs')
    }
    packaging.jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] }
    signingConfigs.debug {
        storeFile new File(workspace, 'build/android/debug-signing/debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
